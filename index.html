<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="contenedor">
    <form id="form-login" class="tarjeta" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="subtitulo">Ingresa tus datos para continuar</p>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario" autocomplete="username">
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="campo-password">
          <input type="password" id="password" name="password" placeholder="Escribe tu contraseña" autocomplete="current-password">
          <button type="button" id="btn-mostrar" class="btn-mostrar" aria-label="Mostrar contraseña" title="Mostrar contraseña">
            <!-- Ojo abierto: se ve cuando la contraseña está oculta -->
            <svg class="icono-ojo" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Ojo tachado: se ve cuando la contraseña está visible -->
            <svg class="icono-ojo-tachado" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <p id="mensaje" class="mensaje" role="alert"></p>

      <button type="submit" class="btn-principal">Ingresar</button>

      <p class="pista">Usuario de prueba: <strong>admin</strong> / <strong>1234</strong></p>
    </form>
  </main>
</body>
</html>
